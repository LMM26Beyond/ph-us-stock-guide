<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stock Guide</title>
<meta name="theme-color" content="#050816">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stock Guide">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Futuristic glass theme: frosted panels over a glowing dark background. */
:root {
  color-scheme: dark;
  --bg: #050816;
  --glass: rgba(255, 255, 255, 0.06); --glass-strong: rgba(255, 255, 255, 0.10);
  --edge: rgba(255, 255, 255, 0.14); --edge-hi: rgba(255, 255, 255, 0.28);
  --text: #eef3ff; --text-2: #a9b4d0; --muted: #6f7a99;
  --s1: #38d9ff; --s2: #ffb547; --grid: rgba(255, 255, 255, 0.07); --focus: #38d9ff;
  --up: #3dffa8; --down: #ff5c7a; --mixed: #ffb547;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; min-height: 100vh; color: var(--text); background: var(--bg);
  font: 15px/1.5 "Space Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased; }
/* Glowing orbs behind the glass, fixed so panels slide over them. */
.aurora { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none;
  background: radial-gradient(1200px 800px at 50% -10%, #12204a 0%, transparent 60%), var(--bg); }
.aurora i { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .55; animation: drift 24s ease-in-out infinite alternate; }
.aurora i:nth-child(1) { width: 46vmax; height: 46vmax; left: -12vmax; top: -10vmax; background: #1f6bff; }
.aurora i:nth-child(2) { width: 38vmax; height: 38vmax; right: -10vmax; top: 18vh; background: #8a2bff; animation-delay: -8s; }
.aurora i:nth-child(3) { width: 34vmax; height: 34vmax; left: 20vw; bottom: -14vmax; background: #00d4c8; opacity: .35; animation-delay: -16s; }
.aurora::after { content: ""; position: absolute; inset: 0;
  background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
  background-size: 48px 48px; mask-image: radial-gradient(ellipse at 50% 0%, #000 30%, transparent 75%); }
@keyframes drift { to { transform: translate(6vmax, 4vmax) scale(1.12); } }
@media (prefers-reduced-motion: reduce) { .aurora i { animation: none; } }
.glass { background: var(--glass); border: 1px solid var(--edge); border-radius: 20px;
  -webkit-backdrop-filter: blur(22px) saturate(160%); backdrop-filter: blur(22px) saturate(160%);
  box-shadow: inset 0 1px 0 var(--edge-hi), 0 10px 40px rgba(0, 0, 0, .35); }
main { max-width: 1100px; margin: 0 auto; padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); }
header { position: sticky; top: 8px; z-index: 5; display: flex; gap: 12px; align-items: center;
  justify-content: space-between; padding: 12px 16px; margin-bottom: 16px; border-radius: 18px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { flex: none; filter: drop-shadow(0 0 8px rgba(56, 217, 255, .6)); }
h1 { font-size: 19px; margin: 0; letter-spacing: .04em; text-transform: uppercase; }
h2 { font-size: 13px; margin: 0 0 10px; color: var(--text-2); letter-spacing: .14em; text-transform: uppercase; font-weight: 600; }
.sub { color: var(--text-2); font-size: 12px; font-family: var(--mono); }
.tabs { display: inline-flex; padding: 4px; gap: 4px; border-radius: 999px; background: rgba(0,0,0,.25); border: 1px solid var(--edge); }
.tabs button { border: 0; background: transparent; color: var(--text-2); padding: 7px 16px; border-radius: 999px;
  font: 600 13px/1 "Space Grotesk", system-ui, sans-serif; letter-spacing: .08em; cursor: pointer; transition: background .2s, color .2s, box-shadow .2s; }
.tabs button[aria-selected="true"] { background: linear-gradient(135deg, #38d9ff, #7b5cff); color: #050816;
  box-shadow: 0 0 18px rgba(56, 217, 255, .55); }
.tabs button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.card { padding: 18px; margin-bottom: 16px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin: 14px 0; }
.tile { padding: 12px 14px; border-radius: 14px; background: var(--glass-strong); border: 1px solid var(--edge); }
.tile .label { color: var(--text-2); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
.tile .value { font: 600 22px/1.3 var(--mono); }
.state { display: inline-flex; align-items: center; gap: 10px; font-size: 26px; font-weight: 700; letter-spacing: .02em; }
.state::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: currentColor; box-shadow: 0 0 14px currentColor; }
.state.Uptrend { color: var(--up); } .state.Downtrend { color: var(--down); } .state.Mixed { color: var(--mixed); }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--text-2); margin: 4px 0 8px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; box-shadow: 0 0 6px currentColor; }
.tip { position: absolute; pointer-events: none; background: rgba(10, 16, 40, .85); border: 1px solid var(--edge);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); font-family: var(--mono);
  border-radius: 10px; padding: 6px 9px; font-size: 12px; white-space: nowrap; display: none; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 8px; border-bottom: 1px solid var(--grid); text-align: right; white-space: nowrap; }
td { font-family: var(--mono); font-size: 12.5px; }
th { color: var(--muted); font-weight: 600; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
tbody tr { transition: background .15s; } tbody tr:hover { background: rgba(56, 217, 255, .06); }
td.l, th.l { text-align: left; }
td.sym { font-family: "Space Grotesk", system-ui, sans-serif; font-weight: 700; color: var(--s1); }
td.name { font-family: "Space Grotesk", system-ui, sans-serif; color: var(--text-2); max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 600px) { .name { display: none; } h1 { font-size: 16px; } }
.score { display: inline-block; min-width: 34px; padding: 2px 6px; border-radius: 8px; text-align: center;
  background: rgba(56, 217, 255, .12); border: 1px solid rgba(56, 217, 255, .35); color: var(--text); }
.note { color: var(--text-2); font-size: 13px; margin: 10px 0 0; }
details summary { cursor: pointer; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 13px; color: var(--text-2); }
ul.alerts { margin: 0; padding-left: 20px; }
ul.alerts li::marker { color: var(--s1); }
footer { color: var(--muted); font-size: 12px; margin: 24px 4px; padding-bottom: env(safe-area-inset-bottom); }
a { color: var(--s1); }
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<main>
  <header class="glass">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#7b5cff"/><stop offset="1" stop-color="#38d9ff"/></linearGradient></defs>
        <path d="M3 24 L11 15 L17 20 L28 7" fill="none" stroke="url(#lg)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="28" cy="7" r="3" fill="#38d9ff"/></svg>
      <div><h1>Stock Guide</h1><div class="sub" id="asof">Loading…</div></div>
    </div>
    <div class="tabs" role="tablist" aria-label="Market">
      <button role="tab" id="tab-ph" aria-selected="true" data-m="ph">PSE</button>
      <button role="tab" id="tab-us" aria-selected="false" data-m="us">US</button>
    </div>
  </header>
  <div id="app"></div>
  <footer>
    Automated technical analysis of past prices, not licensed financial advice. Signals are
    probabilities, not certainties. Full reports, methods and back-test details are in the
    <a href="https://github.com/LMM26Beyond/ph-us-stock-guide/tree/main/reports">reports folder</a>.
  </footer>
</main>
<script>
const CUR = { ph: "₱", us: "$" };
const INDEX = { PSEI: "PSEi", SPX: "S&P 500" };
const data = {};
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pct = (x, d = 1) => x == null ? "–" : (x > 0 ? "+" : "") + (100 * x).toFixed(d) + "%";
const plain = (x, d = 1) => x == null ? "–" : (100 * x).toFixed(d) + "%";
const num = (x, d = 2) => x == null ? "–" : x.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtDate = s => new Date(s + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });

function lineChart(el, dates, series, opts = {}) {
  // series: [{name, values, color}]; one shared y-axis.
  // Drawn at the container's real width so text stays at its true size on a phone.
  const W = Math.max(300, el.clientWidth || 900), H = W < 600 ? 200 : 260, m = { t: 10, r: 64, b: 24, l: 52 };
  const n = dates.length, all = series.flatMap(s => s.values).filter(v => v != null);
  let lo = Math.min(...all), hi = Math.max(...all);
  const pad = (hi - lo) * 0.05 || 1; lo -= pad; hi += pad;
  const x = i => m.l + (W - m.l - m.r) * i / Math.max(n - 1, 1);
  const y = v => m.t + (H - m.t - m.b) * (1 - (v - lo) / (hi - lo));
  const ticks = 4, fy = opts.fmt || (v => num(v, 0));
  let g = "";
  for (let k = 0; k <= ticks; k++) {
    const v = lo + (hi - lo) * k / ticks;
    g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/>` +
         `<text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${fy(v)}</text>`;
  }
  const years = [];
  dates.forEach((d, i) => { if (i === 0 || d.slice(0, 4) !== dates[i - 1].slice(0, 4)) years.push(i); });
  if (years.length > 1 && x(years[1]) - x(years[0]) < 60) years.shift();   // partial first year
  const step = Math.ceil(years.length / Math.max(2, Math.floor((W - m.l - m.r) / 70)));
  years.filter((_, k) => k % step === 0).forEach(i =>
    g += `<text x="${x(i)}" y="${H - 6}" font-size="11" fill="var(--muted)">${dates[i].slice(0, 4)}</text>`);
  const gid = "fill-" + (el.id || "c");
  g += `<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${series[0].color};stop-opacity:.28"/><stop offset="1" style="stop-color:${series[0].color};stop-opacity:0"/></linearGradient></defs>`;
  series.forEach((s, k) => {
    let d = "", pen = false, first = null, last = null;
    s.values.forEach((v, i) => { if (v == null) { pen = false; return; } d += (pen ? "L" : "M") + x(i).toFixed(1) + "," + y(v).toFixed(1); pen = true; first ??= i; last = i; });
    if (k === 0 && first != null)   // soft glow under the main line
      g += `<path d="${d}L${x(last).toFixed(1)},${H - m.b}L${x(first).toFixed(1)},${H - m.b}Z" fill="url(#${gid})" stroke="none"/>`;
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" style="filter: drop-shadow(0 0 4px ${s.color})"/>`;
    const li = s.values.length - 1 - [...s.values].reverse().findIndex(v => v != null);
    g += `<text x="${x(li) + 6}" y="${y(s.values[li]) + 4}" font-size="11" fill="var(--text-2)">${esc(s.short || s.name)}</text>`;
  });
  g += `<line class="cross" y1="${m.t}" y2="${H - m.b}" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"/>`;
  series.forEach((s, k) => g += `<circle class="dot${k}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>`);
  el.innerHTML = `<div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>` +
    `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(opts.label || "")}">${g}<rect x="${m.l}" y="0" width="${W - m.l - m.r}" height="${H}" fill="transparent"/></svg><div class="tip"></div>`;
  const svg = $("svg", el), tip = $(".tip", el), cross = $(".cross", el);
  const move = ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width;
    const i = Math.max(0, Math.min(n - 1, Math.round((px - m.l) / (W - m.l - m.r) * (n - 1))));
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("visibility", "visible");
    series.forEach((s, k) => { const c = $(".dot" + k, el), v = s.values[i];
      if (v == null) c.setAttribute("visibility", "hidden");
      else { c.setAttribute("cx", x(i)); c.setAttribute("cy", y(v)); c.setAttribute("visibility", "visible"); } });
    tip.innerHTML = `<b>${fmtDate(dates[i])}</b><br>` + series.map(s =>
      `<span style="color:${s.color}">●</span> ${esc(s.name)}: ${s.values[i] == null ? "–" : fy(s.values[i])}`).join("<br>");
    tip.style.display = "block";
    const left = (ev.clientX - r.left) + 12;
    tip.style.left = Math.min(left, r.width - tip.offsetWidth - 4) + "px"; tip.style.top = "36px";
  };
  svg.addEventListener("pointermove", move);
  svg.addEventListener("pointerleave", () => { tip.style.display = "none"; cross.setAttribute("visibility", "hidden");
    series.forEach((_, k) => $(".dot" + k, el).setAttribute("visibility", "hidden")); });
}

function spark(values) {
  const v = values.filter(x => x != null); if (v.length < 2) return "";
  const lo = Math.min(...v), hi = Math.max(...v), W = 90, H = 24;
  const d = v.map((p, i) => (i ? "L" : "M") + (W * i / (v.length - 1)).toFixed(1) + "," + (H - 2 - (H - 4) * (p - lo) / ((hi - lo) || 1)).toFixed(1)).join("");
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-label="six-month price line"><path d="${d}" fill="none" stroke="var(--s1)" stroke-width="1.5" style="filter: drop-shadow(0 0 3px var(--s1))"/></svg>`;
}

function table(rows, m) {
  if (!rows.length) return `<p class="note">None today.</p>`;
  const cur = CUR[m], lots = m === "ph";
  const head = `<tr><th class="l">Stock</th><th class="l name">Name</th><th>Close</th>${lots ? "<th>Min. buy</th>" : ""}<th>Score</th><th>3 mo</th><th>12 mo</th><th>RSI</th><th>P/E</th><th>ROE</th><th>Div yield</th><th class="l">6 months</th></tr>`;
  const body = rows.map(r => `<tr><td class="l sym">${esc(r.symbol)}</td><td class="l name" title="${esc(r.name)}">${esc(r.name)}</td>` +
    `<td>${cur}${num(r.close)}</td>${lots ? `<td>${cur}${num(r.min_buy, 0)}</td>` : ""}<td><span class="score">${r.score ?? "–"}</span></td>` +
    `<td>${pct(r.ret3m, 0)}</td><td>${pct(r.ret12m, 0)}</td><td>${r.rsi ?? "–"}</td>` +
    `<td>${r.loss ? "loss" : r.pe == null ? "–" : r.pe > 100 ? "n/m" : num(r.pe, 1)}</td><td>${pct(r.roe, 0)}</td><td>${plain(r.div_yield)}</td>` +
    `<td class="l">${spark(r.spark)}</td></tr>`).join("");
  return `<div class="scroll"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}

let current = null;
addEventListener("resize", () => { clearTimeout(window._rt); window._rt = setTimeout(() => current && charts(current), 150); });

function render(m) {
  current = data[m] ? m : null;
  const d = data[m], app = $("#app");
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.m === m));
  try { localStorage.setItem("market", m); } catch (e) {}
  if (!d) { app.innerHTML = `<div class="card glass">No data for this market yet.</div>`; $("#asof").textContent = ""; return; }
  const cur = CUR[m], iname = INDEX[d.index_name] || d.index_name, part = (m === "ph" ? 100000 : 10000);
  $("#asof").textContent = `Data up to ${fmtDate(d.date)}`;
  const bs = d.backtest.rules_stats, is = d.backtest.index_stats;
  app.innerHTML = `
  <section class="card glass">
    <h2>The market</h2>
    <div class="state ${esc(d.state)}">${esc(d.state)}</div>
    <p class="note">${esc(d.advice)}</p>
    <div class="tiles">
      <div class="tile"><div class="label">${esc(iname)}</div><div class="value">${num(d.index.close)}</div></div>
      <div class="tile"><div class="label">vs 200-day average</div><div class="value">${pct(d.index.vs200)}</div></div>
      <div class="tile"><div class="label">3 months / 12 months</div><div class="value">${pct(d.index.ret3m, 0)} / ${pct(d.index.ret12m, 0)}</div></div>
      <div class="tile"><div class="label">Stocks above their 200-day average</div><div class="value">${plain(d.breadth, 0)}</div></div>
    </div>
    <div class="chart" id="idx"></div>
  </section>
  ${d.alerts && d.alerts.length ? `<section class="card glass"><h2>Latest changes</h2><ul class="alerts">${d.alerts.map(a => `<li>${esc(a).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")}</li>`).join("")}</ul></section>` : ""}
  <section class="card glass">
    <h2>Buy candidates</h2>
    ${table(d.buys, m)}
    <p class="note"><b>How much to buy:</b> split the money for ${m === "ph" ? "PSE" : "US"} stocks into ${d.slots} equal parts, one per pick
      (with ${cur}${num(part, 0)}, ${cur}${num(part / d.slots, 0)} a stock). Hold while the score stays at 60 or more; sell when it drops below at a month-end.
      ${m === "ph" ? "<i>Min. buy</i> is the cost of one board lot. " : ""}P/E, ROE and dividend yield are for context only: as buy filters they lowered returns in the back-test.</p>
  </section>
  <section class="card glass">
    <details><summary>Avoid (${d.avoid.length})</summary>
    <p class="note">Liquid stocks with the weakest scores: falling trend and lagging the market.</p>
    ${table(d.avoid, m)}</details>
  </section>
  <section class="card glass">
    <h2>Back-test: following these rules vs holding the index</h2>
    <div class="tiles">
      <div class="tile"><div class="label">Rules, a year (after costs)</div><div class="value">${pct(bs.cagr)}</div></div>
      <div class="tile"><div class="label">${esc(iname)}, a year</div><div class="value">${pct(is.cagr)}</div></div>
      <div class="tile"><div class="label">Rules, worst drop</div><div class="value">${pct(bs.max_dd, 0)}</div></div>
      <div class="tile"><div class="label">${esc(iname)}, worst drop</div><div class="value">${pct(is.max_dd, 0)}</div></div>
    </div>
    <div class="chart" id="bt"></div>
    <p class="note">Growth of 1 invested at the start, monthly rebalancing, real trading costs${m === "ph" ? " and board lots" : ""}.
      Delisted stocks are missing from the data, which flatters the rules. A past result does not promise a future one.</p>
  </section>`;
  charts(m);
}

function charts(m) {
  const d = data[m], iname = INDEX[d.index_name] || d.index_name;
  lineChart($("#idx"), d.index_chart.dates, [
    { name: iname, short: iname, values: d.index_chart.close, color: "var(--s1)" },
    { name: "200-day average", short: "200-day", values: d.index_chart.sma200, color: "var(--s2)" }],
    { label: `${iname} over three years with its 200-day average` });
  lineChart($("#bt"), d.backtest.dates, [
    { name: "Current rules", short: "Rules", values: d.backtest.rules, color: "var(--s1)" },
    { name: `Hold the ${iname}`, short: iname, values: d.backtest.index, color: "var(--s2)" }],
    { label: "Back-test growth of 1", fmt: v => v.toFixed(1) + "×" });
}

// Online only: no offline copy. Data is fetched fresh every time the app is
// opened or brought back to the front.
if ("serviceWorker" in navigator)   // remove any worker an earlier version installed
  navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => render(b.dataset.m)));

function load() {
  return Promise.all(["ph", "us"].map(m => fetch(`dashboard_${m}.json?t=${Date.now()}`, { cache: "no-store" })
    .then(r => r.ok ? r.json() : null).catch(() => null).then(j => { if (j) data[m] = j; else delete data[m]; })))
    .then(() => {
      if (!data.ph && !data.us) {
        $("#app").innerHTML = `<div class="card glass">Can't reach the server. This app needs an internet connection; check it and reopen.</div>`;
        $("#asof").textContent = "Offline";
        return;
      }
      const stamp = JSON.stringify([data.ph && data.ph.date, data.us && data.us.date]);
      if (current && stamp === load.stamp) return;   // nothing new: keep the page as it is
      load.stamp = stamp;
      let m = current || "ph";
      if (!current) try { m = localStorage.getItem("market") || m; } catch (e) {}
      render(data[m] ? m : (data.ph ? "ph" : "us"));
    });
}
load();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") load(); });
</script>
