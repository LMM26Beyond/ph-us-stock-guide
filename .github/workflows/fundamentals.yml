name: Fundamentals

# Company financials change once a quarter; a weekly refresh is plenty.
# Stored as fundamentals.tar.gz on the "data" release.
on:
  schedule:
    - cron: "0 2 * * 6"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/fundamentals.yml"
      - "stockguide/sources/sec.py"
      - "stockguide/sources/pse_fundamentals.py"

permissions:
  contents: write

concurrency:
  group: fundamentals

jobs:
  fundamentals:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      # Pull-request runs only refresh the US half while the SEC download is being tested.
      MARKET: ${{ github.event_name == 'pull_request' && 'us' || 'all' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Download company financials
        run: |
          mkdir -p data
          {
            for u in https://www.sec.gov/files/company_tickers.json https://data.sec.gov/api/xbrl/companyfacts/CIK0000320193.json; do
              for ua in "ph-us-stock-guide LMM26Beyond@users.noreply.github.com" "LMM26Beyond stock research admin@example.com"; do
                echo "SEC check: $u [$ua] -> $(curl -s -o /tmp/sec.out -w '%{http_code}' -A "$ua" "$u") $(head -c 300 /tmp/sec.out | tr -d '\n')"
              done
            done
          } | tee data/fundamentals.log
          python -m stockguide fundamentals --market "$MARKET" 2>&1 | tee -a data/fundamentals.log
          exit ${PIPESTATUS[0]}

      - name: Store
        if: always()
        run: |
          paths=$(ls -d data/fundamentals.log data/ph/fundamentals data/us/fundamentals.csv.gz 2>/dev/null || true)
          [ -n "$paths" ] || exit 0
          tar -czf fundamentals.tar.gz $paths
          gh release view data >/dev/null 2>&1 || \
            gh release create data --title "Price data" \
              --notes "Daily candles used by the stock guide. Updated automatically."
          gh release upload data fundamentals.tar.gz --clobber
