name: Daily update

# Weekdays at 22:30 UTC: after the US close (20:00/21:00 UTC) and well after
# the PSE close (07:00 UTC). Candles are kept in data.tar.gz on the "data"
# release; reports are committed to reports/.
on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      market:
        description: "ph, us or all"
        default: "all"

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-update

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      GH_TOKEN: ${{ github.token }}
      MARKET: ${{ inputs.market || 'all' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore stored candles
        run: |
          if gh release download data --pattern data.tar.gz; then
            tar -xzf data.tar.gz && rm data.tar.gz
          else
            echo "No stored data yet: this run starts the full download."
          fi
          # Company financials, refreshed weekly by the Fundamentals workflow.
          if gh release download data --pattern fundamentals.tar.gz; then
            tar -xzf fundamentals.tar.gz && rm fundamentals.tar.gz
          fi

      - name: Download new candles
        # The first full download can take longer than one run; whatever is
        # saved is kept and the next run carries on from there.
        run: python -m stockguide update --market "$MARKET" --max-minutes 150

      - name: Store candles
        if: always()
        run: |
          [ -d data ] || exit 0
          tar -czf data.tar.gz --exclude=data/ph/fundamentals --exclude=data/us/fundamentals.csv.gz --exclude=data/fundamentals.log --exclude="data/alerts_*" data
          gh release view data >/dev/null 2>&1 || \
            gh release create data --title "Price data" \
              --notes "Daily candles used by the stock guide. Updated automatically."
          gh release upload data data.tar.gz --clobber

      - name: Analyse
        run: python -m stockguide analyze --market "$MARKET"

      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ ':!reports/portfolio.md'
          git diff --cached --quiet && exit 0
          git commit -m "Reports for $(date -u +%F)"
          git push

      - name: Build dashboard
        run: python -m stockguide dashboard

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Post alerts
        # Changes since the last run go to the open "Stock alerts" issue, so
        # GitHub notifies the repository owner by e-mail and in the app.
        run: |
          ls data/alerts_*.md >/dev/null 2>&1 || exit 0
          gh label create alerts --color FBCA04 --description "Daily stock alerts" 2>/dev/null || true
          n=$(gh issue list --label alerts --state open --json number --jq '.[0].number')
          if [ -z "$n" ]; then
            n=$(gh issue create --label alerts --title "Stock alerts" \
              --body "Changes in the market trend and the buy lists, posted after each daily update. Unsubscribe here to stop the e-mails." | grep -o '[0-9]*$')
          fi
          { echo "@${{ github.repository_owner }} changes in today's reports:"; echo; for f in data/alerts_*.md; do cat "$f"; echo; done; } > alert.md
          gh issue comment "$n" --body-file alert.md

  # Publishes the dashboard to GitHub Pages. Needs Pages turned on once
  # (Settings > Pages > Source: GitHub Actions); until then this job fails
  # without failing the run.
  dashboard:
    needs: update
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
